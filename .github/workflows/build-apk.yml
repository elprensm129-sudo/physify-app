name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b3a6e' --iconBackgroundColorDark '#0b3a6e'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk physify.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: تطبيق المنصة
          files: physify.apk
