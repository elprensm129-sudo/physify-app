name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png
          npx @capacitor/assets generate --android
      - name: Safety check for icon
        run: |
          R=android/app/src/main/res
          if ! ls $R/mipmap-*/ic_launcher_background.* >/dev/null 2>&1; then
            echo "background icon missing, removing adaptive icon files"
            rm -rf $R/mipmap-anydpi-v26
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk physify.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: تطبيق المنصة
          files: physify.apk
